name: CedarScan
options:
  bundleIdPrefix: com.cedar247
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  CedarScan:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    scheme:
      testTargets: []
    sources:
      - Sources
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedar247.cedarscan
        PRODUCT_NAME: CedarScan
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Màu nhấn "cobalt" của app (chủ app chốt 2026-07-23) thay cho xanh dương MẶC ĐỊNH của
        # hệ thống — màu cũ nhạt quá. Định nghĩa ở Assets.xcassets/AccentColor.colorset, có HAI
        # sắc độ: #1D4ED8 cho nền sáng, #5B9BFF cho nền tối (iOS tự đổi).
        # 🔴 KHÔNG CÓ DÒNG NÀY THÌ MÀU KHÔNG ĂN. XcodeGen/Xcode không tự nhận asset tên
        # "AccentColor" làm màu nhấn toàn app; thiếu build setting này thì file màu vẫn nằm trong
        # catalog mà `Color.accentColor`/`.tint`/nút trong alert vẫn dùng xanh hệ thống — sai
        # kiểu IM LẶNG, CI vẫn xanh, chỉ lộ khi sideload.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: "1"
        # 🔴 TĂNG SỐ NÀY MỖI LẦN GIAO IPA CHO CHỦ APP. 06/08 có ba bản IPA ra cách nhau ~1
        # tiếng, cùng hiện "1.0" → chủ app test trúng bản cũ mà không ai biết, báo "lỗi vẫn
        # nguyên" oan. AltStore (My Apps) và Cài đặt iOS đều hiện số này — nó là cách DUY NHẤT
        # xác minh từ xa máy ông đang chạy bản nào. Ghi số giao kèm vào SESSION-HANDOFF §STATE.
        MARKETING_VERSION: "2.13"
    info:
      path: Sources/Info.plist
      properties:
        # 🔴 KHÔNG CÓ DÒNG NÀY THÌ SỐ PHIÊN BẢN KHÔNG ĂN: XcodeGen thấy khối `info:` tự khai
        # là nó ghi CỨNG "1.0" vào Info.plist, MARKETING_VERSION ở settings bị bỏ qua im lặng
        # (đã dính 06/08 — IPA build xong vẫn 1.0). Trỏ về biến để chỉ một nguồn sự thật.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: CedarScan
        NSCameraUsageDescription: CedarScan cần dùng camera và cảm biến LiDAR để quét không gian 3D.
        # Chỉ dùng cho nút "Dùng vị trí hiện tại" ở màn nhập địa chỉ trước khi quét: lấy toạ độ
        # MỘT LẦN rồi đổi ra địa chỉ. Không theo dõi nền (không khai NSLocationAlwaysAnd...).
        # Từ chối quyền này KHÔNG chặn gì — khách gõ địa chỉ bằng tay là quét bình thường.
        # TIẾNG ANH, không phải tiếng Việt: khách thật của Cedar247 là khách nước ngoài (app chỉ
        # hiện tiếng Việt khi MÁY đặt tiếng Việt), và App Store review đọc chuỗi này bằng tiếng
        # Anh — purpose string không đọc được là dạng dễ ăn 5.1.1.
        # ⚠ NSCameraUsageDescription ở trên vẫn đang là tiếng Việt (có từ trước đợt này). Nên đổi
        # nốt, nhưng để chủ app quyết vì nó không nằm trong phạm vi đợt này.
        NSLocationWhenInUseUsageDescription: CedarScan uses your location only to fill in the address of the property you are about to scan. You can always type the address by hand instead.
        # NSMicrophoneUsageDescription đã BỎ 2026-07-19 cùng luồng quay video khảo sát: chỗ duy
        # nhất dùng micro là VideoScanFlowView (đã xoá). ScanVideoRecorder của mesh mode chỉ dựng
        # AVAssetWriterInput video, không có input audio nào. Khai quyền cho tính năng không tồn
        # tại là thứ App Store sẽ hỏi, và người đọc plist sau này sẽ tưởng app còn ghi âm.
        # NẾU sau này thêm thuyết minh giọng nói cho mesh mode thì khai lại KÈM code thật —
        # thiếu purpose string lúc xin quyền là app CRASH.
        # 🔴 ĐÃ GỠ 2026-08-11 (bản 2.2): `UIFileSharingEnabled` +
        # `LSSupportsOpeningDocumentsInPlace`. ✗ KHAI LẠI KHI CHƯA HỎI CHỦ APP.
        # Hai khoá đó (và CHỈ hai khoá đó) là lý do Files app hiện được thư mục Documents của
        # app ở "On My iPhone → CedarScan". Chúng thêm ở bản đo 1.3 CHỈ để chủ app tự lấy
        # `Documents/perf-logs/` ra khỏi máy (bản Release qua AltStore không có console) —
        # chiến dịch đo đó XONG từ 10/08 (giả thuyết đói main-thread đã bị bác).
        # Tác dụng phụ mới là thứ phải gỡ: khách nhìn thấy luôn `Documents/Scans/` — toàn bộ
        # thư mục làm việc, phơi bày THỤ ĐỘNG, không ai bấm gì cũng thấy. Chủ app 11/08:
        # "tôi không muốn khách biết cái file đó có gì. chỉ muốn họ xem được video và mesh
        # trên app". (Thư mục của 3DSA/Scaniverse KHÔNG hiện trong Files app dù file bản quét
        # của họ cũng nằm trên máy ⇒ họ không khai hai khoá này — suy từ TRIỆU CHỨNG, chưa ai
        # mở plist của họ ra đọc.)
        # · File bản quét VẪN nằm nguyên trên máy (ARKit dựng mesh trên máy, phải ghi ra đĩa
        #   mới nén/tải lên được) — gỡ hai khoá chỉ giấu chúng khỏi trình duyệt file.
        # · Đường XUẤT của khách KHÔNG đổi: nút **Chia sẻ** ở màn bản quét vẫn còn và PHẢI
        #   còn — đó là cách khách gửi bổ sung bản quét cho chủ app khi đã lỡ đặt đơn.
        # · Đi CÙNG LƯỢT với `ScanPerfProfiler.enabled = false`: gỡ hai khoá là lấy mất đường
        #   đọc log, để bộ đo chạy tiếp thì chỉ ghi file không ai lấy được.
        # · Cần đo lại lần sau: khai lại CẢ HAI khoá + bật cờ profiler, giao bản đo cho riêng
        #   chủ app, ĐO XONG GỠ LẠI. ✗ để lẫn vào bản giao khách.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
