# THROWAWAY: simulator screenshots of the Fog step 5 scan screen. Never merge to main.
name: Fog5 scan-screen shots (throwaway)

on:
  push:
    branches: ['claude/fog5-shots']

jobs:
  shots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project CedarScan.xcodeproj -scheme CedarScan

      - name: Pick an iOS 26 iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          PICK=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          c = []
          for runtime, devices in data.items():
              if 'iOS-26' not in runtime:
                  continue
              for d in devices:
                  if d.get('isAvailable') and 'iPhone' in d['name']:
                      c.append((runtime, d))
          if not c:
              sys.exit('no iOS 26 iPhone simulator')
          top = max(r for r, _ in c)
          best = sorted((d for r, d in c if r == top), key=lambda d: (0 if d['name'].endswith(' Pro') else 1, d['name']))
          print(best[0]['udid'] + ' ' + best[0]['name'] + ' ' + top)
          ")
          echo "Picked: $PICK"
          echo "udid=${PICK%% *}" >> "$GITHUB_OUTPUT"

      - name: Boot simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      - name: Shots (light)
        run: |
          set -o pipefail
          xcrun simctl ui "${{ steps.sim.outputs.udid }}" appearance light
          xcodebuild test \
            -project CedarScan.xcodeproj \
            -scheme CedarScan \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:CedarScanUITests \
            -resultBundlePath light.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee light.log | grep -E "FOG5|Test Case|error:|\*\* TEST" || true

      - name: Shots (dark)
        if: always()
        run: |
          set -o pipefail
          xcrun simctl ui "${{ steps.sim.outputs.udid }}" appearance dark
          xcodebuild test \
            -project CedarScan.xcodeproj \
            -scheme CedarScan \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:CedarScanUITests \
            -resultBundlePath dark.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee dark.log | grep -E "FOG5|Test Case|error:|\*\* TEST" || true

      - name: Export screenshots
        if: always()
        run: |
          for m in light dark; do
            if [ -d "$m.xcresult" ]; then
              xcrun xcresulttool export attachments --path "$m.xcresult" --output-path "shots/$m" || true
            fi
          done
          ls -laR shots || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fog5-shots
          path: |
            shots
            light.log
            dark.log
