# THROWAWAY (branch claude/fog6-shots, never main): WrappedText sweep, German (trap #44).
name: Fog6 WrappedText sweep (throwaway)

on:
  workflow_dispatch:

jobs:
  sweep:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        lang: [de]
        shard: ['0/3', '1/3', '2/3']
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project CedarScan.xcodeproj -scheme CedarScan

      - name: Create an iPhone 16 Pro simulator (iOS 26)
        id: sim
        run: |
          set -euo pipefail
          RT=$(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          r = [x for x in json.load(sys.stdin)['runtimes'] if x['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS-26') and x.get('isAvailable')]
          print(sorted(r, key=lambda x: x['version'])[-1]['identifier'])
          ")
          UDID=$(xcrun simctl create "Wrap" "com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro" "$RT")
          echo "Created $UDID on $RT"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Sweep
        env:
          TEST_RUNNER_SWEEP_BUDGET: '9000'
          TEST_RUNNER_SWEEP_SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project CedarScan.xcodeproj \
            -scheme CedarScan \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:CedarScanAuditTests/WrappedTextSweep \
            -testLanguage ${{ matrix.lang }} \
            -resultBundlePath sweep.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee sweep.log | grep -E "WRAP|Test Case|error:|\*\* TEST" || true

      - name: Export
        if: always()
        run: |
          grep "WRAP" sweep.log > wrap-${{ matrix.lang }}-${{ strategy.job-index }}.txt || true
          xcrun xcresulttool export attachments --path sweep.xcresult --output-path att || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrap-${{ matrix.lang }}-${{ strategy.job-index }}
          path: |
            wrap-*.txt
            att
            sweep.log
