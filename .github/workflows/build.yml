name: Build CedarScan IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The String Catalogs are generated: fail if they drift from translations.json / project.yml
      # (e.g. regenerated by an older copy of the tool, which drops the English purpose strings).
      - name: Check generated String Catalogs
        run: |
          python3 tools/build_xcstrings.py
          git diff --exit-code -- Localization || {
            echo "::error::Localization/ is stale: run tools/build_xcstrings.py from an up-to-date main and commit the result"
            exit 1
          }

      # Same Xcode as release.yml, so the AltStore build is the app that ships. See the note there.
      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Its own step, so a package/network failure is not mistaken for a compile error.
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project CedarScan.xcodeproj -scheme CedarScan

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project CedarScan.xcodeproj \
            -scheme CedarScan \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/CedarScan.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/CedarScan.xcarchive/Products/Applications/CedarScan.app" build/Payload/
          cd build
          zip -qry CedarScan.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CedarScan-ipa
          path: build/CedarScan.ipa

      # 🔴 dSYM = KHẢ NĂNG ĐỌC CRASH LOG. Không có nó thì mọi .ips chủ app gửi về chỉ có 4 dòng
      # `imageOffset` trần trong ảnh CedarScan, và bản Release đã strip symtab nên KHÔNG cách nào
      # dò ngược ra tên hàm — đó chính là chỗ bí của vụ văng 10/08 (2 log, không ai chỉ được đích
      # danh dòng nào, mất một vòng suy đoán). Từ bản 1.5 trở đi, mỗi build giữ lại dSYM.
      # Cách dùng khi có log mới:
      #   1. tải artifact `CedarScan-dsym` của ĐÚNG build mà .ips ghi trong `app_version`;
      #   2. đối chiếu `LC_UUID` của dSYM với `slice_uuid` ở dòng đầu .ips — PHẢI trùng, khác
      #      là sai build, dừng lại;
      #   3. `atos -o CedarScan.app.dSYM/Contents/Resources/DWARF/CedarScan -arch arm64 \
      #        -l 0x100000000 <0x100000000 + imageOffset>` cho từng khung CedarScan.
      #      (Cần máy Mac cho `atos`; GitHub Actions runner macos-15 chạy được.)
      # ⚠ Artifact GitHub mặc định hết hạn sau 90 ngày — log cũ hơn thế thì phải build lại đúng
      # commit đó, và UUID sẽ KHÁC nên symbolicate không còn khớp. Gặp crash thì lấy dSYM NGAY.
      - name: Upload dSYM (for symbolicating crash logs)
        uses: actions/upload-artifact@v4
        with:
          name: CedarScan-dsym
          path: build/CedarScan.xcarchive/dSYMs
