# THROWAWAY (branch claude/textcut-audit, never main): sweep every text for the iOS 26 wrap cut.
name: Text-cut sweep (throwaway)

on:
  push:
    branches: ['claude/textcut-audit']

jobs:
  sweep:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        lang: [de]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project CedarScan.xcodeproj -scheme CedarScan

      - name: Create an iPhone 16 Pro simulator (iOS 26)
        id: sim
        run: |
          set -euo pipefail
          RT=$(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          r = [x for x in json.load(sys.stdin)['runtimes'] if x['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS-26') and x.get('isAvailable')]
          print(sorted(r, key=lambda x: x['version'])[-1]['identifier'])
          ")
          UDID=$(xcrun simctl create "Textcut" "com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro" "$RT")
          echo "Created $UDID on $RT"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Sweep
        env:
          TEST_RUNNER_TEXTCUT_STEP: '1'
          TEST_RUNNER_TEXTCUT_BUDGET: '480'
        run: |
          set -o pipefail
          xcodebuild test \
            -project CedarScan.xcodeproj \
            -scheme CedarScan \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:CedarScanAuditTests \
            -testLanguage ${{ matrix.lang }} \
            -resultBundlePath sweep.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee sweep.log | grep -E "TEXTCUT|Test Case|error:|\*\* TEST" || true

      - name: Export
        if: always()
        run: |
          grep "TEXTCUT" sweep.log > textcut-${{ matrix.lang }}.txt || true
          xcrun xcresulttool export attachments --path sweep.xcresult --output-path att || true
          ls -laR att || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: textcut-${{ matrix.lang }}
          path: |
            textcut-*.txt
            att
            sweep.log
