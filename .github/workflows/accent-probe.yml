# THROWAWAY: what the accent colour resolves to on iOS 26 vs iOS 18 simulators. Never merge.
name: Accent probe (throwaway)

on:
  push:
    branches: ['claude/accent-probe']

jobs:
  probe:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        runtime: ['iOS-26', 'iOS-18']
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project CedarScan.xcodeproj -scheme CedarScan

      - name: Create an iPhone 16 Pro simulator
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          RT=$(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          r = [x for x in json.load(sys.stdin)['runtimes'] if x['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.${{ matrix.runtime }}') and x.get('isAvailable')]
          print(sorted(r, key=lambda x: [int(p) for p in x['version'].split('.')])[-1]['identifier'])
          ")
          UDID=$(xcrun simctl create "Probe" "com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro" "$RT")
          echo "Created $UDID on $RT"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "rt=$RT" >> "$GITHUB_OUTPUT"

      - name: Boot simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      - name: Probe (light)
        run: |
          set -o pipefail
          xcrun simctl ui "${{ steps.sim.outputs.udid }}" appearance light
          xcodebuild test \
            -project CedarScan.xcodeproj \
            -scheme CedarScan \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:CedarScanUITests/AccentProbeTests \
            -resultBundlePath light.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee light.log | grep -E "Test Case|error:|\*\* TEST|PROBE" || true

      - name: Probe (dark)
        if: always()
        run: |
          set -o pipefail
          xcrun simctl ui "${{ steps.sim.outputs.udid }}" appearance dark
          xcodebuild test \
            -project CedarScan.xcodeproj \
            -scheme CedarScan \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:CedarScanUITests/AccentProbeTests \
            -resultBundlePath dark.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee dark.log | grep -E "Test Case|error:|\*\* TEST|PROBE" || true

      - name: Built app facts
        if: always()
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -path "*Debug-iphonesimulator/CedarScan.app" | head -1)
          echo "app: $APP"
          {
            echo "runtime ${{ steps.sim.outputs.rt }}"
            plutil -p "$APP/Info.plist" | grep -i -E "accent|DTXcode|DTSDK|MinimumOS|DTPlatformVersion"
            xcrun assetutil --info "$APP/Assets.car" | python3 -c "
          import json, sys
          for a in json.load(sys.stdin):
              if a.get('Name') == 'AccentColor':
                  print('asset', a.get('Appearance'), a.get('Color components'), a.get('Colorspace'))
          "
          } | tee facts.txt

      - name: Export and summarise
        if: always()
        run: |
          for m in light dark; do
            if [ -d "$m.xcresult" ]; then
              xcrun xcresulttool export attachments --path "$m.xcresult" --output-path "shots/$m" || true
            fi
          done
          grep -h "PROBE " light.log | sed 's/.*PROBE /PROBE /' > probe-light.txt || true
          grep -h "PROBE " dark.log | sed 's/.*PROBE /PROBE /' > probe-dark.txt || true
          wc -l probe-*.txt
          for m in light dark; do
            MSG=$( (cat facts.txt; grep -E " accent (probe-|sw-)" probe-$m.txt) | python3 -c "import sys; print(sys.stdin.read().replace('%','%25').replace('\n','%0A'))")
            echo "::notice title=${{ matrix.runtime }} $m::$MSG"
          done

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accent-probe-${{ matrix.runtime }}
          path: |
            shots
            facts.txt
            probe-light.txt
            probe-dark.txt
            light.log
            dark.log
