# Dò năng lực runner: có Xcode/simulator nào chạy được iOS 26 không.
# Mục đích: dựng bộ TÁI HIỆN lỗi "lề về 0 sau khi quét" trên simulator trong CI, để vòng lặp
# thử-sai chạy ở đây thay vì trên điện thoại chủ app. Chỉ chạy tay (workflow_dispatch).
name: Diag simulators
on:
  workflow_dispatch:
jobs:
  diag-macos-15:
    runs-on: macos-15
    steps:
      - name: Xcode versions + simulator runtimes
        run: |
          echo "== /Applications =="
          ls /Applications | grep -i xcode || true
          echo "== selected =="
          xcode-select -p
          xcodebuild -version
          echo "== runtimes =="
          xcrun simctl list runtimes || true
  diag-macos-26:
    runs-on: macos-26
    continue-on-error: true
    steps:
      - name: Xcode versions + simulator runtimes
        run: |
          echo "== /Applications =="
          ls /Applications | grep -i xcode || true
          echo "== selected =="
          xcode-select -p
          xcodebuild -version
          echo "== runtimes =="
          xcrun simctl list runtimes || true
